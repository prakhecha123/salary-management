databases:
  - name: salary-management-db
    plan: free

services:
  - type: web
    name: salary-management-api
    env: ruby
    plan: free
    rootDir: backend
    buildCommand: "bundle install && bundle exec rails db:migrate"
    startCommand: "bundle exec rails server -b 0.0.0.0 -p $PORT"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: salary-management-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://salary-management-frontend.onrender.com

  - type: static
    name: salary-management-frontend
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://salary-management-api.onrender.com
